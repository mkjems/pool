<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#060607" />
  <title>Pool</title>
  <meta name="description" content="8-ball pool in the browser with real physics. Play the computer or a friend. No ads, no sign-up." />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="canonical" href="https://pool.mkjems.dk/" />
  <!-- Link previews (Facebook, Messenger, WhatsApp, Slack, LinkedIn, X, ...). -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="M. Kjems" />
  <meta property="og:title" content="Pool" />
  <meta property="og:description" content="8-ball pool in the browser with real physics. Play the computer or a friend. No ads, no sign-up." />
  <meta property="og:url" content="https://pool.mkjems.dk/" />
  <meta property="og:image" content="https://pool.mkjems.dk/share.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Pool. Play a fun game online. The 8-ball and the cue ball on a green table in a lamplit pool hall." />
  <meta name="twitter:card" content="summary_large_image" />
  <script>
    window.goatcounter = { path: (p) => location.host + p, no_onload: location.hostname !== "pool.mkjems.dk" };
  </script>
  <script data-goatcounter="https://stats.mkjems.dk/count" async src="//stats.mkjems.dk/count.js"></script>
</head>
<body>
  <canvas id="c" aria-label="Pool table"></canvas>
  <div id="hud">
    <header class="bar">
      <a class="brand" href="https://mkjems.dk/" title="More games at mkjems.dk">Pool</a>
      <nav>
        <button id="b-menu" title="Menu">Menu</button>
        <button id="b-labels" title="Show ball numbers (hold Space)">Numbers</button>
        <button id="b-guide" title="Aim guide (G)">Guide: full</button>
        <button id="b-cloth" title="Cloth colour (C)">Cloth</button>
        <button id="b-sound" title="Volume (M mutes)">Sound: high</button>
        <button id="b-room" title="Room sound: the faint air of a quiet hall" aria-pressed="false">Room</button>
      </nav>
    </header>
    <div id="score" class="score" hidden>
      <div class="p" data-p="0"><span class="name">Player 1</span><span class="tray"></span></div>
      <div id="potted" class="potted" title="Potted" hidden></div>
      <div class="p" data-p="1"><span class="name">Player 2</span><span class="tray"></span></div>
    </div>
    <div id="labels" class="labels"></div>
    <div id="power" class="power" aria-label="Power: drag down and release to shoot">
      <div class="track"><div class="fill"></div><div class="knob"></div></div>
    </div>
    <button id="spin" class="spin" title="Spin: where the tip strikes (W A S D, or right-click the table)"><span class="dot"></span></button>
    <div id="spin-pad" class="spin-pad" hidden>
      <div class="pad"><span class="dot"></span><span class="cross"></span></div>
      <p>Drag to set where the tip strikes</p>
      <div class="row"><button id="spin-reset">Centre</button><button id="spin-done">Done</button></div>
    </div>
    <div id="toast" class="toast" role="status"></div>
    <div id="net" class="net" role="status" hidden></div>
    <div id="menu" class="menu">
      <div class="card">
        <h1>Pool</h1>
        <p>8-ball with real physics.</p>
        <button data-mode="cpu" class="primary">Play the computer</button>
        <div class="levels" role="radiogroup" aria-label="Computer level">
          <button data-level="easy" role="radio">Easy</button>
          <button data-level="medium" role="radio">Medium</button>
          <button data-level="hard" role="radio">Hard</button>
        </div>
        <button data-mode="pass">Two players, one device</button>
        <button id="b-online">Play a friend online</button>
        <button data-mode="practice">Practice</button>
      </div>
    </div>
    <div id="online" class="menu" hidden>
      <div class="card">
        <h1>Play a friend</h1>
        <p>Send them a link, or join theirs.</p>
        <input id="name" placeholder="Your name" maxlength="20" autocomplete="nickname" aria-label="Your name">
        <button id="b-invite" class="primary">Invite a friend</button>
        <p class="or">Got a code from a friend?</p>
        <div class="row">
          <input id="join-code" placeholder="Code" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Your friend's code">
          <button id="b-join">Join</button>
        </div>
        <button id="b-online-back" class="link">Back</button>
      </div>
    </div>
    <div id="invite" class="menu" hidden>
      <div class="card">
        <h1>Play a friend</h1>
        <p id="invite-text"></p>
        <div id="invite-share" hidden>
          <div class="row"><input id="invite-link" readonly aria-label="Link for your friend"><button id="b-copy">Copy</button></div>
          <p class="code">Or tell them the code <strong id="invite-code"></strong></p>
          <button id="b-share" class="primary" hidden>Share the link</button>
        </div>
        <button id="b-invite-cancel">Cancel</button>
      </div>
    </div>
    <div id="over" class="menu" hidden>
      <div class="card">
        <h1 id="over-title">Player 1 wins</h1>
        <p id="over-why"></p>
        <button id="b-rematch" class="primary">Rematch</button>
        <button id="b-over-menu">Menu</button>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
